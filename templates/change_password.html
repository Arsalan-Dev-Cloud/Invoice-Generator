{% extends "dashboard_layout.html" %}

{% block title %}
Change Password - Invoice Generator
{% endblock %}


{% block content %}

<div class="page-header">

    <div>

        <h1>
            Change Password
        </h1>

        <p>
            Update your account password
        </p>

    </div>

</div>


<div class="dashboard-card">

    <h2>
        Change Your Password
    </h2>

    <p>
        Enter your current password and choose a new password.
    </p>


    <form method="POST">

        <div class="form-group">

            <label for="current_password">
                Current Password
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                required
            >

        </div>


        <div class="form-group">

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >

        </div>


        <div class="details-actions">

            <button
                type="submit"
                class="back-btn"
            >
                Change Password
            </button>


            <a
                href="/profile"
                class="back-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
