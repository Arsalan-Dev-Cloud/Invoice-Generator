<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Invoice Generator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #007bff;
        }

        .login-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #007bff;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #0056b3;
        }

        .message {

            background: #e6f4ea;

            color: #137333;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;
        }

        .signup-link {

            text-align: center;

            margin-top: 20px;
        }

        .signup-link a {

            color: #007bff;

            text-decoration: none;
        }

        .forgot-password {

            text-align: right;

            margin-top: -8px;

            margin-bottom: 20px;
        }

        .forgot-password a {

            color: #007bff;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <a href="/" class="back-home">← Back to Home</a>

        <h1>Login</h1>

        <p class="subtitle">
            Login to your Invoice Generator account
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST" action="/login">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <div class="forgot-password">

                <a href="/forgot-password">
                    Forgot Password?
                </a>

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="signup-link">

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
