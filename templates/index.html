<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Generator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <h1>Invoice Generator</h1>

            <p>Create and download professional invoices</p>

        </div>


        <!-- Invoice Card -->

        <div class="invoice-card">

            <h2>Create Invoice</h2>


            <form action="/generate" method="POST">


                <!-- Customer Name -->

                <div class="form-group">

                    <label for="customer_name">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customer_name"
                        name="customer_name"
                        placeholder="Enter customer name"
                        required
                    >

                </div>


                <!-- Customer Email -->

                <div class="form-group">

                    <label for="customer_email">
                        Customer Email
                    </label>

                    <input
                        type="email"
                        id="customer_email"
                        name="customer_email"
                        placeholder="Enter customer email"
                        required
                    >

                </div>


                <!-- Invoice Items -->

                <h3 class="items-title">
                    Invoice Items
                </h3>


                <div id="items-container">

                    <div class="item-row">

                        <div class="form-group">

                            <label>Product</label>

                            <input
                                type="text"
                                name="product_name[]"
                                placeholder="Product name"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Quantity</label>

                            <input
                                type="number"
                                name="quantity[]"
                                placeholder="Qty"
                                min="1"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Price</label>

                            <input
                                type="number"
                                name="price[]"
                                placeholder="Price"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>

                </div>
                <button
                    type="button"
                    class="add-item-btn"
                    onclick="addItem()"
                >
                    + Add Item
                </button>


                <!-- Generate Button -->

                <button
                    type="submit"
                    class="generate-btn"
                >
                    Generate Invoice
                </button>

                <a href="/dashboard" class="dashboard-btn">
                    📊 Dashboard
                </a>

                <a href="/history" class="history-btn">
                    📋 Invoice History
                </a>


            </form>

        </div>


        <!-- Footer -->

        <div class="footer">

            <p>
                Invoice Generator • Built with Python & Flask
            </p>

        </div>

    </div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
